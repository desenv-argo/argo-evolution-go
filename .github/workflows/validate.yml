name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l $(find cmd pkg -name '*.go' -type f))
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: Run Go tests
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build Manager extensions
        working-directory: manager
        run: |
          node scripts/build.mjs
          node --check src/argo-manager.js

      - name: Ensure generated Manager assets are committed
        run: git diff --exit-code -- manager/dist

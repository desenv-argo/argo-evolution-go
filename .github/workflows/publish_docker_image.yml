name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
  workflow_dispatch:

concurrency:
  # A merge can emit both push and pull_request events. Keep a single deploy.
  group: publish-docker-main
  cancel-in-progress: true

env:
  REGISTRY: argoevolutiongoacr.azurecr.io
  IMAGE_NAME: argo-evolution-go

jobs:
  build_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-beta') }}
            type=raw,value=sha-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Cache availability must not block publishing a valid image.
          cache-to: type=gha,mode=min,ignore-error=true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      # Azure App Service watches argo-evolution-go:latest through the ACR
      # continuous-deployment webhook. Publishing this tag triggers the App
      # Service to pull the new image and replace the running container.

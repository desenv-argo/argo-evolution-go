name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: argoevolutiongoacr.azurecr.io
  IMAGE_NAME: argo-evolution-go
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  build_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-beta') }}
            type=raw,value=sha-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      # Pushing an image to ACR is CI only. This explicit deployment step closes
      # the CD loop, points App Service at an immutable tag, and makes Azure pull
      # the new image without a manual restart or a mutable :latest cache race.
      - name: Validate deployment configuration
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$WEBAPP_NAME" || { echo "Repository variable AZURE_WEBAPP_NAME is required"; exit 1; }
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || { echo "Repository secret AZURE_WEBAPP_PUBLISH_PROFILE is required"; exit 1; }

      - name: Deploy immutable image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Verify application health
        if: ${{ vars.AZURE_WEBAPP_HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ vars.AZURE_WEBAPP_HEALTHCHECK_URL }}
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_URL"; then
              exit 0
            fi
            echo "Health check attempt $attempt/18 failed; waiting for the new container"
            sleep 10
          done
          exit 1
